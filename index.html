<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NY Artists Gallery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0d0d; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 2rem; }
  h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; font-weight: 600; color: #f5f5f5; }
  .count { text-align: center; color: #888; margin-bottom: 2rem; font-size: 0.9rem; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; max-width: 1400px; margin: 0 auto; }
  .card { background: #1a1a1a; border-radius: 8px; overflow: hidden; transition: transform 0.2s; position: relative; }
  .card:hover { transform: translateY(-4px); }
  .card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .card .name { padding: 0.6rem 0.75rem; font-size: 0.82rem; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-top: 1px solid #2a2a2a; }
  .fav-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s; z-index: 1; }
  .fav-btn:hover { transform: scale(1.15); }
  .fav-btn.active { color: #ff4060; }
  .toggle { display: block; margin: 0 auto 1.5rem; background: #222; color: #ccc; border: 1px solid #333; border-radius: 6px; padding: 0.5rem 1.2rem; font-size: 0.9rem; cursor: pointer; transition: background 0.2s; }
  .toggle:hover { background: #333; }
  .toggle.on { background: #ff4060; color: #fff; border-color: #ff4060; }
</style>
</head>
<body>
<h1>NY Artists Gallery</h1>
<p class="count" id="count"></p>
<button class="toggle" id="toggleFavs">Show Favorites</button>
<div class="gallery" id="gallery"></div>

<script>
(function() {
  const STORAGE_KEY = 'ny-favorites';
  const gallery = document.getElementById('gallery');
  const countEl = document.getElementById('count');
  const toggle = document.getElementById('toggleFavs');
  let favorites = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
  let showingFavs = false;
  let cards = [];

  const BASE_URL = 'https://netayume-artists.netlify.app/';
  fetch('artists.json')
    .then(r => r.json())
    .then(artists => {
      countEl.textContent = artists.length + ' artists';
      const frag = document.createDocumentFragment();
      artists.forEach(name => {
        const src = BASE_URL + 'images/' + name + '.png';
        const card = document.createElement('div');
        card.className = 'card';

        const btn = document.createElement('button');
        btn.className = 'fav-btn' + (favorites.has(src) ? ' active' : '');
        btn.textContent = favorites.has(src) ? '❤' : '♡';
        btn.onclick = function(e) {
          e.stopPropagation();
          if (favorites.has(src)) { favorites.delete(src); btn.classList.remove('active'); btn.textContent = '♡'; }
          else { favorites.add(src); btn.classList.add('active'); btn.textContent = '❤'; }
          localStorage.setItem(STORAGE_KEY, JSON.stringify([...favorites]));
          if (showingFavs) applyFilter();
        };

        const img = document.createElement('img');
        img.loading = 'lazy';
        img.src = src;
        img.alt = name;

        const nameEl = document.createElement('div');
        nameEl.className = 'name';
        nameEl.textContent = name;

        card.append(btn, img, nameEl);
        frag.appendChild(card);
      });
      gallery.appendChild(frag);
      cards = Array.from(gallery.querySelectorAll('.card'));
    });

  toggle.onclick = function() {
    showingFavs = !showingFavs;
    toggle.textContent = showingFavs ? 'Show All' : 'Show Favorites';
    toggle.classList.toggle('on', showingFavs);
    applyFilter();
  };

  function applyFilter() {
    cards.forEach(card => {
      const src = card.querySelector('img').getAttribute('src');
      card.style.display = (!showingFavs || favorites.has(src)) ? '' : 'none';
    });
  }
})();
</script>
</body>
</html>
